<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191712" />
    <title>math examples</title>
    <link rel="stylesheet" href="./src/theme.css" />
    <style>
        /* mobile-first base styles */
        body {
            margin: 0;
            padding: 0;
            font-family: var(--mc-sans);
            background: var(--color-background);
            height: 100vh;
            display: flex;
            overflow: hidden;

            /* vars */
            --color-background: var(--mc-page);
            --color-card: var(--mc-base);
            --color-border: rgba(234, 229, 218, 0.08);
            --color-viewer: var(--mc-base);
            --color-ink: var(--mc-ink);
            --color-glass: rgba(20, 18, 14, 0.72);
            --mono: var(--mc-mono);
        }

        /* sidebar - mobile first (hidden by default) */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 100%;
            max-width: 320px;
            background: var(--color-background);
            color: var(--color-ink);
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            box-shadow: 2px 0 10px rgba(20, 18, 14, 0.3);
            /* hidden scrollbar */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .sidebar::-webkit-scrollbar {
            display: none;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        /* title + search scroll together as one sticky unit */
        .sidebar-top {
            position: sticky;
            top: 0;
            z-index: 2;
            background: var(--color-background);
        }

        .sidebar-header {
            padding: 18px 14px 10px;
        }

        .sidebar-header h1 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            font-family: var(--mc-sans);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.01em;
            line-height: 1;
        }

        .sidebar-header h1 svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .sidebar-header p {
            margin: 8px 0 0;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.04em;
            color: var(--mc-dim);
        }

        .search-container {
            margin: 0;
            padding: 0 14px 12px;
        }

        .search-input {
            width: 100%;
            border: 1px solid rgba(234, 229, 218, 0.12);
            border-radius: 0;
            padding: 9px 12px;
            background: rgba(234, 229, 218, 0.04);
            color: var(--color-ink);
            font-size: 11px;
            font-family: var(--mono);
            text-transform: lowercase;
            box-sizing: border-box;
            transition: border-color 0.18s ease, background 0.18s ease;
        }

        .search-input::placeholder {
            color: #6f6a5e;
        }

        .search-input:focus {
            outline: none;
            border-color: rgba(234, 229, 218, 0.28);
            background: rgba(234, 229, 218, 0.07);
        }

        .examples-list {
            padding: 10px 14px 16px;
            margin: 0;
            list-style: none;
        }

        .examples-list li {
            margin-bottom: 12px;
        }

        .examples-list li:last-child {
            margin-bottom: 16px;
        }

        .category-header {
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: lowercase;
            color: var(--mc-dim);
            margin: 0 0 10px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--color-border);
            list-style: none;
        }

        .category-group {
            margin-bottom: 22px;
        }

        .category-group.hidden {
            display: none;
        }

        .example-item {
            display: block;
            color: var(--color-ink);
            background-color: var(--color-card);
            text-decoration: none;
            cursor: pointer;
            border: 1px solid rgba(234, 229, 218, 0.12);
            border-radius: 0;
            overflow: hidden;
            transition: border-color 0.16s ease;
        }

        .example-item:hover {
            border-color: rgba(234, 229, 218, 0.5);
        }

        .example-item.active {
            border-color: var(--mc-accent);
        }

        .example-preview {
            position: relative;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            /* placeholder gradient shown until (or if) the screenshot loads */
            background: radial-gradient(120% 120% at 30% 20%,
                    #2a2721 0%, #1d1b16 55%, #14120e 100%);
        }

        .example-screenshot {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            -webkit-user-drag: none;
            user-select: none;
        }

        .example-overlay {
            position: absolute;
            left: 0;
            bottom: 0;
            padding: 10px;
            pointer-events: none;
        }

        .example-title {
            display: inline-block;
            margin: 0;
            padding: 4px 9px;
            background: var(--mc-ink);
            color: var(--mc-base);
            font-family: var(--mono);
            font-weight: 500;
            font-size: 13px;
            line-height: 1.2;
            letter-spacing: 0.01em;
            text-transform: lowercase;
        }

        .content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .content-header {
            background: var(--color-background);
            border-bottom: 1px solid var(--color-border);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hamburger {
            display: block;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            color: var(--color-ink);
        }

        .content-header h2 {
            margin: 0;
            font-size: 16px;
            color: var(--color-ink);
            flex: 1;
        }

        /* the demo lives inside its own rounded container floating on the page */
        .viewer {
            position: relative;
            flex: 1;
            overflow: hidden;
            background: var(--color-viewer);
        }

        .example-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: var(--color-viewer);
        }

        /* title overlaid top-left of the demo (desktop) */
        .viewer-title {
            position: absolute;
            top: 18px;
            left: 20px;
            z-index: 3;
            pointer-events: none;
            display: none;
        }

        .viewer-title h2 {
            margin: 0;
            font-family: var(--mc-sans);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: var(--color-ink);
        }

        /* source / open / fullscreen buttons, bottom-right of the demo */
        .viewer-toolbar {
            position: absolute;
            right: 14px;
            bottom: 14px;
            z-index: 3;
            display: flex;
            gap: 8px;
        }

        .viewer-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 11px;
            background: var(--color-glass);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(234, 229, 218, 0.14);
            border-radius: 0;
            color: #c9c3b5;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: lowercase;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .viewer-btn:hover {
            background: rgba(34, 31, 25, 0.92);
            border-color: rgba(234, 229, 218, 0.28);
            color: var(--color-ink);
        }

        .viewer-btn svg {
            width: 13px;
            height: 13px;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(20, 18, 14, 0.6);
            z-index: 999;
        }

        .sidebar-overlay.show {
            display: block;
        }

        /* tablet and up - enhance the mobile design */
        @media (min-width: 769px) {
            .sidebar {
                position: static;
                transform: none;
                width: 300px;
                min-width: 300px;
                max-width: none;
                box-shadow: none;
            }

            .content {
                padding: 12px 12px 12px 0;
            }

            .viewer {
                border-radius: 0;
                box-shadow: 0 0 0 1px rgba(234, 229, 218, 0.08);
            }

            .viewer-title {
                display: block;
            }

            .content-header {
                display: none;
            }

            .example-title {
                font-size: 13px;
            }

            .hamburger {
                display: none;
            }

            .sidebar-overlay {
                display: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-header">
                <h1>
                    <!-- the pmndrs mark, github.com/pmndrs/branding (MIT) -->
                    <svg viewBox="0 0 800 800" aria-hidden="true"><path d="M560 0H280V240H560V520H800V0Z"/><rect y="280" width="240" height="240"/><rect x="280" y="280" width="240" height="240"/><rect x="280" y="560" width="240" height="240"/></svg>
                    math
                </h1>
                <p>npm i math</p>
            </div>
            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="search examples..." />
            </div>
        </div>
        <ul class="examples-list" id="examples-list"></ul>
    </div>

    <div class="content">
        <div class="content-header">
            <button class="hamburger" id="hamburger">☰</button>
            <h2 id="example-title">Select an example</h2>
        </div>
        <div class="viewer" id="viewer">
            <iframe class="example-frame" id="example-frame"></iframe>
            <div class="viewer-title">
                <h2 id="viewer-title-text"></h2>
            </div>
            <div class="viewer-toolbar">
                <a class="viewer-btn" id="btn-source" target="_blank" rel="noopener" title="View source on GitHub">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18v-6h6v6M9 6h6"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                    source
                </a>
                <a class="viewer-btn" id="btn-open" target="_blank" rel="noopener" title="Open in a new tab">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
                    open
                </a>
            </div>
        </div>
    </div>

    <script type="module">
        import examples from "./src/examples.json" assert { type: "json" };

        // display order for categories
        const CATEGORY_ORDER = [
            "geometry",
            "shapes",
            "simulation",
            "basics",
            "vectors",
            "matrices",
            "noise",
            "color",
            "random",
            "time",
        ];

        function orderIndex(order, value) {
            const i = order.indexOf(value);
            return i === -1 ? order.length : i;
        }

        function prettyCategory(category) {
            if (!category) return "Other";
            return category.charAt(0).toUpperCase() + category.slice(1);
        }

        function cardHTML(key, example) {
            return `
                <li class="example-card" data-example="${key}">
                    <div class="example-item" data-example="${key}">
                        <div class="example-preview">
                            <img src="./screenshots/${key}.png" alt="${example.title}" class="example-screenshot" draggable="false" onerror="this.style.display='none'">
                            <div class="example-overlay">
                                <h3 class="example-title">${example.title}</h3>
                            </div>
                        </div>
                    </div>
                </li>
            `;
        }

        function addExamplesToSidebar() {
            const examplesList = document.getElementById("examples-list");

            // group entries by category
            const byCategory = new Map();
            for (const [key, example] of Object.entries(examples)) {
                const category = example.category || "other";
                if (!byCategory.has(category)) byCategory.set(category, []);
                byCategory.get(category).push([key, example]);
            }

            const categories = [...byCategory.keys()].sort(
                (a, b) => orderIndex(CATEGORY_ORDER, a) - orderIndex(CATEGORY_ORDER, b),
            );

            let html = "";
            for (const category of categories) {
                html += `<li class="category-group" data-category="${category}">`;
                html += `<div class="category-header">${prettyCategory(category)}</div>`;
                html += `<ul class="examples-list" style="padding:0;">`;
                for (const [key, example] of byCategory.get(category)) {
                    html += cardHTML(key, example);
                }
                html += `</ul></li>`;
            }

            examplesList.innerHTML = html;
        }

        // initialize examples list
        addExamplesToSidebar();

        const titleElement = document.getElementById("example-title");
        const viewerTitleText = document.getElementById("viewer-title-text");
        const frameElement = document.getElementById("example-frame");
        const btnSource = document.getElementById("btn-source");
        const btnOpen = document.getElementById("btn-open");
        const hamburger = document.getElementById("hamburger");
        const sidebar = document.getElementById("sidebar");
        const sidebarOverlay = document.getElementById("sidebar-overlay");
        const searchInput = document.getElementById("search-input");

        // search functionality
        function filterExamples() {
            const searchTerm = searchInput.value.toLowerCase();
            const cards = document.querySelectorAll(".example-card");

            cards.forEach((card) => {
                const exampleKey = card.getAttribute("data-example");
                const example = examples[exampleKey];

                // search in title, description, and tags
                const searchableText = [
                    example.title,
                    example.description,
                    ...(example.tags || []),
                ]
                    .join(" ")
                    .toLowerCase();

                card.style.display = searchableText.includes(searchTerm) ? "" : "none";
            });

            // hide category groups with no visible cards
            document.querySelectorAll(".category-group").forEach((group) => {
                const anyVisible = [...group.querySelectorAll(".example-card")].some(
                    (c) => c.style.display !== "none",
                );
                group.classList.toggle("hidden", !anyVisible);
            });
        }

        // attach search event listener
        searchInput.addEventListener("input", filterExamples);

        // handle sidebar clicks
        function attachEventListeners() {
            const exampleItems = document.querySelectorAll(".example-item");
            exampleItems.forEach((item) => {
                item.addEventListener("click", (e) => {
                    e.preventDefault();
                    const exampleKey = item.getAttribute("data-example");
                    loadExample(exampleKey);
                });
            });
        }

        // mobile navigation
        hamburger.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            sidebarOverlay.classList.toggle("show");
        });

        sidebarOverlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            sidebarOverlay.classList.remove("show");
        });

        function loadExample(exampleKey, scrollIntoView) {
            const example = examples[exampleKey];
            if (!example) return;

            titleElement.textContent = example.title;
            viewerTitleText.textContent = example.title;
            frameElement.src = `./${exampleKey}.html`;
            btnSource.href = `https://github.com/pmndrs/math/blob/main/examples/src/${exampleKey}.ts`;
            btnOpen.href = `./${exampleKey}.html`;

            // update active item
            const exampleItems = document.querySelectorAll(".example-item");

            let activeItem = null;
            exampleItems.forEach((item) => {
                item.classList.remove("active");
                if (item.getAttribute("data-example") === exampleKey) {
                    item.classList.add("active");
                    activeItem = item;
                }
            });

            // scroll active item into view
            if (scrollIntoView && activeItem) {
                activeItem.scrollIntoView({ block: "center", behavior: "auto" });
            }

            // update URL
            window.location.hash = exampleKey;

            // close mobile sidebar
            sidebar.classList.remove("open");
            sidebarOverlay.classList.remove("show");
        }

        // handle hash changes
        function handleHashChange(scrollIntoView = false) {
            const hash = window.location.hash.substring(1);
            if (hash && examples[hash]) {
                loadExample(hash, scrollIntoView);
            } else {
                // load first example by default
                const firstExample = Object.keys(examples)[0];
                loadExample(firstExample, scrollIntoView);
            }
        }

        // initialize
        handleHashChange(true);
        attachEventListeners();
        window.addEventListener("hashchange", () => handleHashChange(true));
    </script>
</body>

</html>
